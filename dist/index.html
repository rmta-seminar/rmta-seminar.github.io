<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Online talks on the theoretical and applied aspects of random matrix theory and related fields.">
  <meta property="og:title" content="RMTA China — Online Seminar">

  <title>RMTA China — Online Seminar</title>
  <style>:root {
  --text: #222;
  --muted: #666;
  --red: #a00000;
  --border: #d8d8d8;
  --background: #fff;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Arial, Helvetica, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--text); background: var(--background); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
body.modal-open { overflow: hidden; }
a { color: var(--red); text-underline-offset: 3px; }
button, input { font: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.page-width { width: min(100% - 40px, 1040px); margin-inline: auto; }

.site-header { min-height: 68px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; padding: 8px max(20px, calc((100vw - 1040px) / 2)); background: #fff; position: sticky; top: 0; z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: bold; text-decoration: none; }
.brand img { width: 42px; height: 42px; object-fit: cover; }
nav { display: flex; gap: 28px; }
nav a { color: var(--text); font-size: 14px; text-decoration: none; }
nav a:hover { color: var(--red); }
.join-link { justify-self: end; font-size: 14px; font-weight: bold; }

.intro { padding-block: 90px 80px; border-bottom: 1px solid var(--border); }
.label { margin: 0 0 16px; color: var(--red); font: 700 24px/1.2 var(--serif); letter-spacing: .02em; }
.intro h1 { margin: 0; font: 400 clamp(48px, 7vw, 76px)/1 var(--serif); }
.intro h2 { margin: 12px 0 28px; color: var(--red); font: 400 clamp(26px, 4vw, 40px)/1.2 var(--serif); }
.intro > p:not(.label) { max-width: 720px; margin: 0 0 10px; }
.intro .schedule { color: var(--muted); }

.section { padding-block: 70px; border-bottom: 1px solid var(--border); }
.section-header { display: flex; align-items: end; justify-content: space-between; gap: 30px; padding-bottom: 18px; border-bottom: 2px solid var(--text); }
.section h2 { margin: 0; font: 400 36px/1.2 var(--serif); }
.talk-card { display: grid; grid-template-columns: 150px 1fr; gap: 28px; padding: 30px 0; border-bottom: 1px solid var(--border); }
.talk-card.featured { padding-block: 38px; }
.talk-date { margin: 0 0 10px; color: var(--red); font-size: 17px; font-weight: bold; }
.talk-card h3 { max-width: 820px; margin: 0 0 12px; font: 400 27px/1.25 var(--serif); }
.speaker { margin: 0; font-weight: bold; }
.speaker span { color: var(--muted); font-weight: normal; }
details { margin-top: 18px; }
summary { width: fit-content; color: var(--red); cursor: pointer; font-size: 14px; }
summary span { display: inline-block; margin-left: 5px; }
details[open] summary span { transform: rotate(45deg); }
.abstract { max-width: 800px; color: #444; }
.abstract p { margin: 14px 0 0; }
.poster-button { width: 150px; padding: 0; border: 1px solid var(--border); background: #fff; cursor: zoom-in; text-align: left; }
.poster-button img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.poster-button span { display: block; padding: 7px 9px; color: var(--red); font-size: 12px; }
.poster-placeholder { width: 150px; aspect-ratio: 4 / 5; padding: 14px; border: 1px solid var(--border); background: #f4f4f4; display: flex; flex-direction: column; justify-content: space-between; color: var(--muted); }
.poster-placeholder strong { color: var(--red); font: 700 17px var(--serif); letter-spacing: .04em; }
.poster-placeholder span { font-size: 12px; line-height: 1.35; }
.abstract mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
.empty { margin: 30px 0 0; color: var(--muted); }

.archive-header { align-items: center; }
.search input { width: min(280px, 100%); padding: 9px 11px; border: 1px solid #aaa; background: #fff; }
.filters { display: flex; align-items: center; gap: 8px; padding: 20px 0 0; }
.filters button { padding: 6px 12px; border: 1px solid #aaa; background: #fff; cursor: pointer; font-size: 13px; }
.filters button.active, .filters button:hover { color: #fff; border-color: var(--red); background: var(--red); }
.filters > span { margin-left: auto; color: var(--muted); font-size: 13px; }

.organizers ul { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; margin: 25px 0 30px; padding: 0; list-style: none; border-top: 1px solid var(--border); }
.organizers li { padding: 16px 0; border-bottom: 1px solid var(--border); }
.organizers li strong, .organizers li span { display: block; }
.organizers li span { color: var(--muted); font-size: 14px; }
.contact { margin: 0; }
footer { display: flex; justify-content: space-between; padding-block: 28px; color: var(--muted); font-size: 13px; }

.poster-modal { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 60px 20px 20px; background: rgba(0,0,0,.88); }
.poster-modal img { max-width: min(92vw, 850px); max-height: calc(100vh - 90px); object-fit: contain; }
.modal-close { position: absolute; top: 20px; right: 24px; padding: 5px; border: 0; color: #fff; background: transparent; cursor: pointer; }

@media (max-width: 760px) {
  .site-header { grid-template-columns: 1fr auto; }
  nav { display: none; }
  .intro { padding-block: 60px; }
  .section { padding-block: 50px; }
  .archive-header { display: grid; }
  .search input { width: 100%; }
  .talk-card { grid-template-columns: 110px 1fr; gap: 18px; }
  .poster-button, .poster-placeholder { width: 110px; }
  .talk-card h3 { font-size: 23px; }
  .organizers ul { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .brand img { width: 36px; height: 36px; }
  .brand span { display: none; }
  .talk-card { grid-template-columns: 1fr; }
  .poster-button, .poster-placeholder { width: 130px; }
  .filters { flex-wrap: wrap; }
  .filters > span { width: 100%; margin: 5px 0 0; }
}

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  <script>window.SEMINAR_CONTENT={"eyebrow":"RMTA China","heading":"Online Seminar","introduction":"This seminar aims to cover topics on both the theoretical and applied aspects of random matrix theory and related fields.","scheduleNote":"The meetings will be held on Zoom and typically scheduled monthly on Thursdays in Beijing Time (UTC/GMT +8 hours).","organizers":[{"name":"Zhigang Bao","affiliation":"University of Hong Kong"},{"name":"Zhenyu Liao","affiliation":"Huazhong University of Science and Technology"},{"name":"Yuanyuan Xu","affiliation":"AMSS, Chinese Academy of Sciences"},{"name":"Lun Zhang","affiliation":"Fudan University"}],"talks":[{"slug":"benoit-collins-2026","date":"2026-08-21","start":"15:15","end":"16:00","speaker":"Benoît Collins","affiliation":"Kyoto University","website":"https://benoitcollins.github.io/index.html","poster":"20260821.png","title":"Operator Norm Estimates of Lehner-type for GUEs via Concentration of Measure","abstract":"Let \\(A_0,A_1,\\ldots,A_n\\) be deterministic Hermitian matrices of fixed size, and let \\(G_1,\\ldots,G_n\\) be independent \\(M \\times M\\) GUE matrices. Consider the matrix-valued Gaussian sum\n\\[\nH_M = A_0 \\otimes I_M + \\frac{1}{\\sqrt{M}} \\sum_{i=1}^{n} A_i \\otimes G_i.\n\\]\nSuch models appear throughout free probability, operator algebras, and quantum information, and a basic question is to locate the edges of their spectrum. A classical answer is Lehner's formula, which describes the edge as the solution of an explicit variational problem.\n\nI will explain how the Sudakov–Fernique comparison inequality, suitably extended to matrix coefficients, yields upper bounds of Lehner type for the expected largest and smallest eigenvalues of Hₘ. The argument is short and relies only on Gaussian comparison, with no moment computations or combinatorics. I will discuss what the method gives, where it is sharp, and a few open questions. Joint work with Yuta Yamagishi. Preprint: arXiv:2606.21137."},{"slug":"yi-han-2026","date":"2026-06-25","start":"09:00","end":"10:00","speaker":"Yi Han","affiliation":"IAS, Princeton University","website":"https://www.ias.edu/scholars/yi-han","poster":"20260625.png","title":"Brown measure convergence for the spectrum of polynomials in Ginibre matrices","abstract":"In this talk we discuss the convergence of the empirical spectral distribution of a non-commutative polynomial in independent Ginibre matrices towards the deterministic limit defined by Brown measure. The main ingredient of proof is a least singular value lower bound for a tensorized Ginibre matrix with a deterministic perturbation. Previously the convergence was proven for polynomials of degree 2 by Cook, Guionnet, and Husson (2022), and we show the convergence holds for polynomials of any degree. The result holds beyond Gaussians and covers entry law with a bounded complex density. Some questions and further research directions will also be discussed."},{"slug":"jun-yin-2026","date":"2026-05-28","start":"11:00","end":"12:00","speaker":"Jun Yin","affiliation":"UCLA","website":"https://sites.google.com/view/jun-yin/home","poster":"20260528.png","title":"Delocalization of non-mean-field random operators with Gaussian entries","abstract":"In this talk, I will discuss some disordered quantum systems beyond the mean-field regime. Last year, in joint work with H. T. Yau, we studied the delocalization conjecture for one-dimensional random band matrices by developing the loop hierarchy method and its tree approximation. Later, in joint work with S. Dubova, F. Yang, and H. T. Yau, we combined this framework with nested diagrammatic techniques previously used in high-dimensional analyses to construct a unified approach capable of handling non-mean-field operators in low dimensions. Most recently, jointly with J. Fan and F. Yang, we established delocalization for power-law random band matrices in the full regime of the decay exponent α > 0 of the variance profile. The key challenge is to address the interplay between the non-mean-field nature of the model and the slow decay of the variance profile."},{"slug":"tom-claeys-2026","date":"2026-04-23","start":"15:00","end":"16:00","speaker":"Tom Claeys","affiliation":"UCLouvain","website":"https://perso.uclouvain.be/tom.claeys/index.html","poster":"20260423.jpg","title":"Biorthogonal ensembles of derivative type","abstract":"I will introduce a class of biorthogonal ensembles on the real line with a specific derivative structure and show that they admit an explicit correlation kernel of double contour integral form. This correlation kernel is a valuable starting point for asymptotic analysis. We will demonstrate this by proving that two new classes of limit kernels can occur in these ensembles. The first type arises in biorthogonal ensembles describing the eigenvalues of the sum of two random matrices, while the second type arises for Muttalib–Borodin type deformations of polynomial ensembles."},{"slug":"peter-forrester-2026","date":"2026-03-26","start":"15:00","end":"16:00","speaker":"Peter Forrester","affiliation":"University of Melbourne","website":"http://www.ms.unimelb.edu.au/~pjforr@unimelb/","poster":"20260326.png","title":"Aspects of large N expansions in random matrix theory","abstract":"Expansions in powers of 1/N in random matrix theory can be traced back to the study of moments for the GUE via graphical methods. In this presentation, a particular 1/N expansion for the mean of a smooth linear statistic for the Gaussian beta ensemble will be taken as the starting point. The shape of this expansion naturally leads to the question of the asymptotic expansion of the density, globally scaled and scaled near the edge. It also leads to the consideration of signed measures, which can be accessed via a loop equation analysis. Returning to the asymptotic expansion of the scaled density, one finds that there are “hidden” integrable structures at higher orders. Viewpoints on these in the context of differential equations satisfied by the density in the classical cases will be discussed."},{"slug":"afonso-bandeira-2025","date":"2025-12-11","start":"17:00","end":"18:00","speaker":"Afonso S. Bandeira","affiliation":"ETH Zürich","website":"https://people.math.ethz.ch/~abandeira/","poster":"20251211.jpg","title":"Matrix Chaos Inequalities and Chaos of Combinatorial Type","abstract":"Matrix concentration inequalities and their recently discovered sharp counterparts provide powerful tools to bound the spectrum of random matrices whose entries are linear functions of independent random variables. However, in many applications one encounters more general random matrix models, called matrix chaoses, whose entries are polynomials of independent random variables. In this talk, we will discuss how to develop general matrix concentration inequalities for matrix chaoses, allowing these models to be treated in a systematic and unified way. Joint work with Kevin Lucca, Petar Nizić-Nikolac, and Ramon van Handel."},{"slug":"anirban-basak-2025","date":"2025-11-06","start":"17:00","end":"18:00","speaker":"Anirban Basak","affiliation":"Tata Institute of Fundamental Research","website":"https://home.icts.res.in/~anirban/","poster":"20251106.png","title":"Spectral properties of non-normal Toeplitz matrices under random perturbation","abstract":"Non-normal matrices often display striking spectral instability: even exponentially small perturbations can cause large movements of their eigenvalues. In this talk, I will describe recent progress on how random perturbations influence the spectra of non-normal Toeplitz matrices. In particular, we will see that sub-exponential additive random perturbation regularizes the spectrum, in the sense of Śniady, whereas an exponentially small perturbation gives rise to a qualitatively different limiting behavior."},{"slug":"yan-fyodorov-2025","date":"2025-10-02","start":"16:00","end":"17:00","speaker":"Yan Fyodorov","affiliation":"King's College London","website":"https://www.kcl.ac.uk/people/yan-fyodorov","poster":"20251002.jpg","title":"Kac–Rice inspired approach to non-Hermitian random matrices","abstract":"We will discuss a method of analyzing the joint probability density of an eigenvalue z and the associated right eigenvector v, normalized with $\\| v \\| = 1$, for non-Hermitian random matrices of a given size $N \\times  N$.\n\nTo illustrate the utility of the general method, I will derive and analyze the joint probability density for two examples: a one-parameter family of matrices interpolating between complex Ginibre and real Ginibre ensembles, and a complex Ginibre matrix additively perturbed by a fixed matrix. In the former case I will discuss the formation of an excess of eigenvalues near the real axis on approaching the real Ginibre limit, giving rise to a new scaling regime of “weak non-reality” as N tends to infinity. In the second case, after providing the general joint probability density, I will briefly discuss a non-Hermitian Rosenzweig–Porter model. If time allows, I will discuss a generalization involving both left and right eigenvectors."},{"slug":"courtney-paquette-2025","date":"2025-09-18","start":"09:00","end":"10:00","speaker":"Courtney Paquette","affiliation":"McGill University","website":"https://cypaquette.github.io","poster":"20250918.png","title":"High-dimensional Optimization in Machine Learning with Applications to Scaling Limits and Compute-Optimal Neural Scaling Laws","abstract":"Given the massive scale of modern machine-learning models, we now only get a single shot to train them effectively. This restricts our ability to test multiple architectures and hyperparameter configurations. Instead, we need to understand how these models scale, allowing us to experiment with smaller problems and apply those insights to larger-scale models. In this talk, I will present a framework for analyzing scaling laws in stochastic learning algorithms using a power-law random features model, leveraging high-dimensional probability and random matrix theory. I will then use this scaling law to address the compute-optimal question: how should we choose model size and hyperparameters to achieve the best possible performance in the most compute-efficient manner? Additionally, I will introduce a scaling limit commonly seen in machine-learning optimization algorithms which has origins in statistical physics, and highlight several promising research directions in scaling laws."},{"slug":"vadim-gorin-2025","date":"2025-07-31","start":"09:00","end":"10:00","speaker":"Vadim Gorin","affiliation":"UC Berkeley","website":"https://www.stat.berkeley.edu/~vadicgor/","poster":"20250731.jpg","title":"How weak are weak factors? Uniform inference for signal strength in signal plus noise models","abstract":"We discuss four classical signal-plus-noise models: the sum of a Wigner matrix and a low-rank perturbation, spiked sample covariance matrices, the factor model, and canonical correlation analysis with low-rank dependencies. Our objective is to construct confidence intervals for the signal strength that are uniformly valid across all regimes—strong, weak, and critical signals. We demonstrate that traditional Gaussian approximations fail in the critical regime. Instead, we introduce a universal transitional distribution that enables valid inference across the entire spectrum of signal strengths. The crucial role is played by the stochastic Airy–Green function, which we will define and examine."},{"slug":"elliot-paquette-2025","date":"2025-06-12","start":"09:30","end":"10:30","speaker":"Elliot Paquette","affiliation":"McGill University","website":"https://elliotpaquette.github.io/","poster":"20250612.jpg","title":"From magic squares, through random matrices, and to the multiplicative chaos","abstract":"In 2004, motivated by connections of random matrix theory to number theory, Diaconis and Gamburd showed a fascinating connection between the enumeration problem of magic squares and the moments of the secular coefficients of random matrices when the matrix size tends to infinity. These are the coefficients in the monomial expansion of a characteristic polynomial, or equivalently the elementary symmetric polynomials of the eigenvalues.\n\nIt turns out that this characteristic polynomial has a limit: it converges to a random fractal, the holomorphic multiplicative chaos. We describe this process on the unit circle and show how it can be connected even more strongly to random matrices, and how magic square combinatorics are a type of signature of this holomorphic multiplicative chaos. We will review open questions and discuss links with other stochastic processes such as Gaussian multiplicative chaos, the circular beta ensemble, and random multiplicative functions."},{"slug":"zhou-fan-2025","date":"2025-05-22","start":"09:00","end":"10:00","speaker":"Zhou Fan","affiliation":"Yale University","website":"http://www.stat.yale.edu/~zf59/","poster":"20250522.jpg","title":"Kronecker-product random matrices and a matrix least squares problem","abstract":"We study the eigenvalue distribution and resolvent of a Kronecker-product random matrix model, which has a mean-field structure in each Kronecker factor but not a global mean-field structure over all variables. Our main results are a quantitative approximation for the Stieltjes transform, a deterministic equivalent approximation for the resolvent, and sharp estimates for entries and blocks of the resolvent on global spectral scales. Our study is motivated by consideration of a matrix-valued least-squares optimization problem, where the dimension of the optimization variable is comparable to the dimensions of the random input matrices. Our analyses imply an asymptotic characterization of the optimal solution and its associated optimal objective value. Joint work with Renyuan Ma."},{"slug":"jiaoyang-huang-2025","date":"2025-04-24","start":"09:00","end":"10:00","speaker":"Jiaoyang Huang","affiliation":"University of Pennsylvania","website":"https://jiaoyang.github.io","poster":"20250424.jpg","title":"Ramanujan Property and Edge Universality of Random Regular Graphs","abstract":"Extremal eigenvalues of graphs are of particular interest in theoretical computer science and combinatorics. Specifically, the spectral gap—the difference between the largest and second-largest eigenvalues—measures the expansion properties of a graph. In this talk, I will focus on random d-regular graphs.\n\nI will begin by providing background on their eigenvalues and connections to random matrix theory. I will then discuss recent results on eigenvalue rigidity and edge universality. Eigenvalue rigidity asserts that, with high probability, each eigenvalue concentrates around its classical location as predicted by the Kesten–McKay distribution. Edge universality states that the second-largest and smallest eigenvalues converge to the Tracy–Widom distribution from the Gaussian Orthogonal Ensemble. Consequently, approximately 69% of d-regular graphs are Ramanujan graphs. Joint work with Theo McKenzie and Horng-Tzer Yau."},{"slug":"lucas-benigni-2025","date":"2025-04-17","start":"09:00","end":"10:00","speaker":"Lucas Benigni","affiliation":"Université de Montréal","website":"https://dms.umontreal.ca/~benignil/","poster":"20250417.jpg","title":"Spectrum of the Neural Tangent Kernel in a quadratic scaling","abstract":"Despite their surplus of parameters, modern deep learning models often generalize well, a phenomenon exemplified by the “double descent curve.” While this behavior is theoretically grasped for problems such as ridge regression under linear scaling of dimensions, intriguing phenomena emerge under quadratic scaling, where sample size equals parameter count. In this presentation, we study the eigenvalues of the Neural Tangent Kernel, a matrix model pertinent to wide neural networks trained via gradient descent, within this quadratic regime."}]};</script>
  <script>(() => {
  const content = window.SEMINAR_CONTENT;
  const site = document.getElementById("site");
  const state = { query: "", year: "All" };
  const escapeHtml = (value = "") => String(value).replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
  const safeUrl = (url = "") => /^https?:\/\//i.test(url) ? escapeHtml(url) : "";
  const posterPath = (poster = "") => `posters/${encodeURIComponent(poster).replaceAll("%2F", "/")}`;
  const talkEnd = (talk) => new Date(`${talk.date}T${talk.end}:00+08:00`).getTime();
  const formatDate = (talk, short = false) => new Intl.DateTimeFormat("en-GB", short ? { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Shanghai" } : { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Shanghai" }).format(new Date(`${talk.date}T12:00:00+08:00`));

  function talkCard(talk, featured = false) {
    const abstract = talk.abstract.split(/\n\s*\n/).map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("");
    const speaker = safeUrl(talk.website) ? `<a href="${safeUrl(talk.website)}" target="_blank" rel="noreferrer">${escapeHtml(talk.speaker)}</a>` : escapeHtml(talk.speaker);
    const poster = talk.poster
      ? `<button class="poster-button" type="button" data-poster="${escapeHtml(talk.slug)}" aria-label="Open poster for ${escapeHtml(talk.title)}"><img src="${posterPath(talk.poster)}" alt="Poster for ${escapeHtml(talk.speaker)}'s talk"><span>View poster</span></button>`
      : `<div class="poster-placeholder" aria-label="Poster not available"><strong>RMTA</strong><span>Poster<br>not available</span></div>`;
    return `<article class="talk-card${featured ? " featured" : ""}">${poster}<div class="talk-content"><p class="talk-date">${featured ? "Next talk · " : ""}${formatDate(talk, !featured)} · ${escapeHtml(talk.start)}–${escapeHtml(talk.end)} Beijing</p><h3>${escapeHtml(talk.title)}</h3><p class="speaker">${speaker} <span>— ${escapeHtml(talk.affiliation)}</span></p><details><summary>Abstract <span aria-hidden="true">+</span></summary><div class="abstract">${abstract}</div></details></div></article>`;
  }

  function render() {
    if (window.MathJax?.typesetClear) window.MathJax.typesetClear([site]);
    const now = Date.now();
    const upcoming = content.talks.filter((talk) => talkEnd(talk) >= now).sort((a, b) => talkEnd(a) - talkEnd(b));
    const past = content.talks.filter((talk) => talkEnd(talk) < now).sort((a, b) => talkEnd(b) - talkEnd(a));
    const years = [...new Set(past.map((talk) => talk.date.slice(0, 4)))];
    const filteredPast = past.filter((talk) => (state.year === "All" || talk.date.startsWith(state.year)) && `${talk.speaker} ${talk.affiliation} ${talk.title} ${talk.abstract}`.toLowerCase().includes(state.query.toLowerCase()));

    site.innerHTML = `
      <header class="site-header">
        <a class="brand" href="#top"><img src="logo.jpg" alt="RMTA China"><span>RMTA China</span></a>
        <nav aria-label="Main navigation"><a href="#programme">Upcoming</a><a href="#archive">Past talks</a><a href="#organizers">Organizers</a></nav>
        <a class="join-link" href="mailto:rmta-seminar+subscribe@googlegroups.com">Join mailing list</a>
      </header>

      <section class="intro page-width" id="top">
        <p class="label">${escapeHtml(content.eyebrow)}</p>
        <h1>${escapeHtml(content.heading)}</h1>
        <h2>Random Matrix Theory &amp; Applications</h2>
        <p>${escapeHtml(content.introduction)}</p>
        <p class="schedule">${escapeHtml(content.scheduleNote)}</p>
      </section>

      <section class="section page-width" id="programme">
        <div class="section-header"><h2>Upcoming talks</h2></div>
        ${upcoming.length ? `<div class="talks">${upcoming.map((talk, index) => talkCard(talk, index === 0)).join("")}</div>` : `<p class="empty">New talks will be announced through the mailing list.</p>`}
      </section>

      <section class="section page-width" id="archive">
        <div class="section-header archive-header"><h2>Past talks</h2><label class="search"><span class="sr-only">Search past talks</span><input id="archive-search" value="${escapeHtml(state.query)}" placeholder="Search talks"></label></div>
        <div class="filters" aria-label="Filter talks by year">${["All", ...years].map((year) => `<button type="button" data-year="${year}" class="${state.year === year ? "active" : ""}">${year}</button>`).join("")}<span>${filteredPast.length} ${filteredPast.length === 1 ? "talk" : "talks"}</span></div>
        <div class="talks archive-list">${filteredPast.map((talk) => talkCard(talk)).join("")}</div>
        ${filteredPast.length ? "" : `<p class="empty">No matching talks.</p>`}
      </section>

      <section class="section page-width organizers" id="organizers">
        <h2>Organizers</h2>
        <ul>${content.organizers.map((organizer) => `<li><strong>${escapeHtml(organizer.name)}</strong><span>${escapeHtml(organizer.affiliation)}</span></li>`).join("")}</ul>
        <p class="contact">Contact: <a href="mailto:rmta.seminar@gmail.com">rmta.seminar@gmail.com</a></p>
      </section>

      <footer class="page-width"><span>RMTA China</span><a href="#top">Back to top</a></footer>`;
    bind();
    if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([site]).catch(() => {});
  }

  function bind() {
    document.querySelectorAll("[data-year]").forEach((button) => button.addEventListener("click", () => { state.year = button.dataset.year; render(); location.hash = "archive"; }));
    document.getElementById("archive-search")?.addEventListener("input", (event) => { state.query = event.target.value; render(); const input = document.getElementById("archive-search"); input?.focus(); input?.setSelectionRange(state.query.length, state.query.length); });
    document.querySelectorAll("[data-poster]").forEach((button) => button.addEventListener("click", () => openPoster(content.talks.find((talk) => talk.slug === button.dataset.poster))));
  }

  function openPoster(talk) {
    if (!talk) return;
    const modal = document.createElement("div");
    modal.className = "poster-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.innerHTML = `<button type="button" class="modal-close">Close</button><img src="${posterPath(talk.poster)}" alt="Poster for ${escapeHtml(talk.speaker)}'s talk">`;
    const close = () => { modal.remove(); document.body.classList.remove("modal-open"); document.removeEventListener("keydown", onKey); };
    const onKey = (event) => { if (event.key === "Escape") close(); };
    modal.addEventListener("mousedown", (event) => { if (event.target === modal) close(); });
    modal.querySelector("button").addEventListener("click", close);
    document.addEventListener("keydown", onKey);
    document.body.classList.add("modal-open");
    document.body.append(modal);
  }

  render();
})();
</script>
</body>
</html>
